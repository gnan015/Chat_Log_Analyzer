<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2;rx:16}.decision{fill:#fef3c7;stroke:#d97706;stroke-width:2}.spam{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:16}.fraud{fill:#fff1f2;stroke:#e11d48;stroke-width:2;rx:16}.result{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}.label{font-size:19px;font-weight:600}.sub{font-size:15px}.line{stroke:#334155;stroke-width:2.5;marker-end:url(#a)}</style>
  <rect width="1500" height="1100" fill="white"/><text x="750" y="55" text-anchor="middle" class="title">Spam and Fraud Detection Logic</text>
  <rect x="620" y="95" width="260" height="70" class="box"/><text x="750" y="138" text-anchor="middle" class="label">New Chat Message</text>
  <polygon points="750,220 910,295 750,370 590,295" class="decision"/><text x="750" y="288" text-anchor="middle" class="label">Same user sent identical</text><text x="750" y="312" text-anchor="middle" class="sub">previous message?</text>
  <rect x="260" y="430" width="270" height="75" class="spam"/><text x="395" y="463" text-anchor="middle" class="label">Spam Detected</text><text x="395" y="488" text-anchor="middle" class="sub">Mark repeated message</text>
  <rect x="970" y="430" width="270" height="75" class="box"/><text x="1105" y="463" text-anchor="middle" class="label">Spam = No</text>
  <rect x="600" y="570" width="300" height="80" class="fraud"/><text x="750" y="604" text-anchor="middle" class="label">Check Fraud Indicators</text><text x="750" y="630" text-anchor="middle" class="sub">Links, OTP/PIN, urgency, prize, UPI</text>
  <rect x="120" y="735" width="270" height="85" class="box"/><text x="255" y="770" text-anchor="middle" class="label">Suspicious Link</text><text x="255" y="796" text-anchor="middle" class="sub">or shortened URL</text>
  <rect x="460" y="735" width="270" height="85" class="box"/><text x="595" y="770" text-anchor="middle" class="label">Sensitive Data Request</text><text x="595" y="796" text-anchor="middle" class="sub">OTP, password, PIN</text>
  <rect x="800" y="735" width="270" height="85" class="box"/><text x="935" y="770" text-anchor="middle" class="label">Urgency or Threat</text><text x="935" y="796" text-anchor="middle" class="sub">Account or payment pressure</text>
  <rect x="1140" y="735" width="270" height="85" class="box"/><text x="1275" y="770" text-anchor="middle" class="label">Prize or Investment</text><text x="1275" y="796" text-anchor="middle" class="sub">Reward or money claim</text>
  <rect x="590" y="900" width="320" height="90" class="result"/><text x="750" y="935" text-anchor="middle" class="label">Calculate Risk Level</text><text x="750" y="962" text-anchor="middle" class="sub">None, Low, Medium, or High</text>
  <line x1="750" y1="165" x2="750" y2="220" class="line"/><line x1="650" y1="345" x2="450" y2="430" class="line"/><text x="530" y="385" class="sub">Yes</text><line x1="850" y1="345" x2="1050" y2="430" class="line"/><text x="930" y="385" class="sub">No</text><line x1="395" y1="505" x2="650" y2="570" class="line"/><line x1="1105" y1="505" x2="850" y2="570" class="line"/><line x1="680" y1="650" x2="255" y2="735" class="line"/><line x1="720" y1="650" x2="595" y2="735" class="line"/><line x1="780" y1="650" x2="935" y2="735" class="line"/><line x1="820" y1="650" x2="1275" y2="735" class="line"/><line x1="255" y1="820" x2="650" y2="900" class="line"/><line x1="595" y1="820" x2="700" y2="900" class="line"/><line x1="935" y1="820" x2="800" y2="900" class="line"/><line x1="1275" y1="820" x2="850" y2="900" class="line"/>
</svg>
